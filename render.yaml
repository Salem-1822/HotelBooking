services:
  - type: web
    name: hotelbooking-demo
    env: php
    plan: free
    region: frankfurt
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan storage:link
      php artisan migrate --force
      apache2-foreground
    envVars:
      - key: APP_NAME
        value: HotelBooking
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: hotelbooking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hotelbooking-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: hotelbooking-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hotelbooking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hotelbooking-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

databases:
  - name: hotelbooking-db
    plan: free
    region: frankfurt
    databaseName: hotelbooking
    user: hotelbooking_user

